name: Uppdatera provschema

on:
  schedule:
    - cron: "0 4 * * *"      # varje morgon ca kl. 06 svensk tid
  push:
    branches: [main]         # även direkt när du ändrar något
  workflow_dispatch:         # knapp för att köra manuellt

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Bygg sidan
        env:
          SCHOOLSOFT_URL: ${{ secrets.SCHOOLSOFT_URL }}
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
